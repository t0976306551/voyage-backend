openapi: 3.0.0
info:
  title: VoyageStack API
  version: 1.0.0

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK

  /api/trips:
    get:
      summary: Get my trips
      responses:
        '200':
          description: List of trips
    post:
      summary: Create a trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Created trip

  /api/trips/join:
    post:
      summary: Join trip by invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
      responses:
        '200':
          description: Joined trip

  /api/trips/{tripId}:
    get:
      summary: Get trip by ID
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip detail
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      summary: Update trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated trip
        '403':
          description: Forbidden

  /api/trips/{tripId}/itinerary:
    get:
      summary: Get all itinerary items for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of itinerary items
    post:
      summary: Add itinerary item
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, title]
              properties:
                day:
                  type: integer
                title:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                sourceUrl:
                  type: string
                note:
                  type: string
      responses:
        '201':
          description: Created item

  /api/trips/{tripId}/itinerary/reorder:
    patch:
      summary: Reorder itinerary items for a day
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /api/trips/{tripId}/itinerary/{itemId}:
    patch:
      summary: Update itinerary item
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated item
    delete:
      summary: Delete itinerary item
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
